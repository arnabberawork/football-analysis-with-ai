[project]
name = "football-agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bert-score>=0.3.13",
    "chromadb>=1.5.9",
    "fastapi>=0.140.0",
    "google-genai>=2.14.0",
    "langgraph>=1.2.9",
    "nltk>=3.10.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_rag"]
